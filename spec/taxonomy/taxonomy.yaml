# sitting_duck universal taxonomy spec
#
# THE single versioned definition of the universal node taxonomy: the 8-bit
# semantic_type encoding, the node flag byte, and the name/native extraction
# strategy enums. The C++ tables that used to be hand-maintained in parallel are
# GENERATED from this file by scripts/generate_taxonomy.py; the committed C++ and
# this spec are kept in lockstep by the "taxonomy tables in sync" CI check.
#
# The src/language_configs/*.def files keep referring to these names
# (DEF_TYPE(raw_type, semantic_type, name_extraction, native_extraction, flags));
# this spec is the single definition those names resolve to.
#
# Edit this file, then run:  python3 scripts/generate_taxonomy.py
#
# Versioning: taxonomy_spec_version is semver'd independently of the extension
# version (v2.0 M1 "the contract", tracker/features/044-v2-m1-contract.md).
#   MAJOR — a code or bit meaning changed (breaks stored semantic_type bytes)
#   MINOR — a name, flag, or strategy was added
#   PATCH — documentation only
taxonomy_spec_version: 1.0.0

# 8-bit semantic type encoding. Byte layout: [ ss kk tt ll ]
#   ss = super_kind         (bits 6-7)  4 super kinds
#   kk = kind               (bits 4-5)  4 kinds within each super kind
#   tt = super_type         (bits 2-3)  4 variants within each kind
#   ll = language_specific  (bits 0-1)  per-language refinement
# A semantic_type's code is super_kind.code | kind.offset | semantic_type.offset,
# so the three tables below fully determine all 64 codes.

rendering:
  # The hand-written C++ declares COMPUTATION's kinds and semantic types before
  # CONTROL_EFFECTS's, while GetKindName/GetKindCode in semantic_types.cpp list
  # kinds in plain numeric code order. Ordering inside a switch or an
  # unordered_map is behaviour-free, so the generator reproduces both orders
  # rather than silently unifying them — that keeps the first generated output
  # byte-identical to the hand-written tables. Unifying them later is a
  # pure-ordering diff, reviewable on its own.
  super_kind_declaration_order: [META_EXTERNAL, DATA_STRUCTURE, COMPUTATION, CONTROL_EFFECTS]

super_kinds:
  - name: META_EXTERNAL
    code: 0x00
  - name: DATA_STRUCTURE
    code: 0x40
  - name: CONTROL_EFFECTS
    code: 0x80
  - name: COMPUTATION
    code: 0xC0

kinds:
  - name: PARSER_SPECIFIC
    super_kind: META_EXTERNAL
    offset: 0x00
  - name: RESERVED
    super_kind: META_EXTERNAL
    offset: 0x10
  - name: METADATA
    super_kind: META_EXTERNAL
    offset: 0x20
  - name: EXTERNAL
    super_kind: META_EXTERNAL
    offset: 0x30
  - name: LITERAL
    super_kind: DATA_STRUCTURE
    offset: 0x00
  - name: NAME
    super_kind: DATA_STRUCTURE
    offset: 0x10
  - name: PATTERN
    super_kind: DATA_STRUCTURE
    offset: 0x20
  - name: TYPE
    super_kind: DATA_STRUCTURE
    offset: 0x30
  - name: OPERATOR
    super_kind: COMPUTATION
    offset: 0x00
  - name: COMPUTATION_NODE
    super_kind: COMPUTATION
    offset: 0x10
  - name: TRANSFORM
    super_kind: COMPUTATION
    offset: 0x20
  - name: DEFINITION
    super_kind: COMPUTATION
    offset: 0x30
  - name: EXECUTION
    super_kind: CONTROL_EFFECTS
    offset: 0x00
  - name: FLOW_CONTROL
    super_kind: CONTROL_EFFECTS
    offset: 0x10
  - name: ERROR_HANDLING
    super_kind: CONTROL_EFFECTS
    offset: 0x20
  - name: ORGANIZATION
    super_kind: CONTROL_EFFECTS
    offset: 0x30

semantic_types:
  - name: PARSER_CONSTRUCT
    kind: PARSER_SPECIFIC
    offset: 0x00
    description: "unique language constructs"
  - name: PARSER_DELIMITER
    kind: PARSER_SPECIFIC
    offset: 0x04
    description: "delimiters, separators"
  - name: PARSER_PUNCTUATION
    kind: PARSER_SPECIFIC
    offset: 0x08
    description: "language-specific punctuation"
  - name: PARSER_SYNTAX
    kind: PARSER_SPECIFIC
    offset: 0x0C
    description: "syntax elements"
  - name: RESERVED_FUTURE1
    kind: RESERVED
    offset: 0x00
    description: "reserved for future use"
  - name: RESERVED_FUTURE2
    kind: RESERVED
    offset: 0x04
    description: "reserved for future use"
  - name: RESERVED_FUTURE3
    kind: RESERVED
    offset: 0x08
    description: "reserved for future use"
  - name: RESERVED_FUTURE4
    kind: RESERVED
    offset: 0x0C
    description: "reserved for future use"
  - name: METADATA_COMMENT
    kind: METADATA
    offset: 0x00
    description: "comments, documentation"
  - name: METADATA_ANNOTATION
    kind: METADATA
    offset: 0x04
