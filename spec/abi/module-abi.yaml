    - {check: dispatch, language: typescript, literal: "string_literal"}   # typescript_native_extractors.hpp:1015
    - {check: table, language: php, literal: "argument_name"}   # function_call_extractor.hpp:169
    - {check: table, language: r, literal: ","}   # function_call_extractor.hpp:214
