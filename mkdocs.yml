site_name: Sitting Duck
site_description: DuckDB extension for SQL-based AST analysis across 27 programming languages
site_author: Sitting Duck Contributors
repo_url: https://github.com/teaguesterling/sitting_duck
repo_name: sitting_duck

theme:
  name: material
  palette:
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      default_handler: python

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

# This nav is EXPLICIT: a page under docs/ that is not listed here does not appear
# in the built site at all. Audited 2026-10-08 — every entry below resolves to an
# existing file, and the only unlisted pages are these, deliberately:
#
#   docs/internal/archive/*.md  — superseded designs, kept for history only
#                                 (see docs/internal/archive/README.md)
#   docs/plans/*.md             — dated historical implementation plans. Note the
#                                 confusing near-duplicate: docs/planning/ IS in the
#                                 nav (live RFCs), docs/plans/ is not (finished plans).
#
# If you add a page under docs/, add it here too, or it is invisible.
