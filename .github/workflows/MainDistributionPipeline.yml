#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # Pushes build only on main. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so every ungated job here built
  # twice per push: 16 duplicate jobs, 2 of them hosted macOS legs and 2
  # hosted Windows, measured on d57882e993 (push run 39149858557 and
  # pull_request run 39149930816, same head_sha). The pull_request run is
  # the one whose status matters. What the filter costs: a branch with no PR
  # open gets no CI until the PR opens. Nothing here deploys on tags, and
  # workflow_dispatch still runs on any branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE PIN IS WHAT WE SHIP; THE REGISTRY'S DEFAULT IS RECORDED SEPARATELY.
  # Fleet rule (Teague, 2026-09-13): the duckdb submodule is pinned at exactly the
  # commit of the tag the stable build ships against, because local builds and each
  # repo's own CI artifacts must carry the same DuckDB as the served one --
  # extensions built in different repos cannot co-load otherwise (the ABI is
  # exact-version). Measured 2026-09-13: five sibling repos were on a July dev
  # commit, one on a v1.5.6-dev commit, one on DuckDB main. Nothing but a check
  # keeps this true.
  #
  # WHAT CHANGED 2026-10-15, and why this job no longer says "pin == registry
  # default": duckdb/community-extensions#3079 ("2.0 Release Prep", merged
  # 15:42Z) moved build.yml's default duckdb_version off the v1.5.6 tag and onto
  # a pinned DuckDB commit on the 2.0 line. This repo still pins v1.5.6. That
  # divergence is REAL, DELIBERATE and UNRESOLVED -- migrating means repointing
  # the shared submodule, which breaks exact-version co-load with the eight
  # sibling repos until they move in lockstep, and runs into a measured ~27x
  # ast_select planning regression on the 2.0 line (tracker/bugs/040, upstream
  # duckdb/duckdb#26036). It is planned in tracker/features/051, not decided here.
  #
  # So the two facts are now separate constants with separate authorities:
  #   DUCKDB_VERSION            what we pin and ship   -> checked against the tag upstream
  #   DUCKDB_REGISTRY_*         what the registry builds -> checked against the registry
  # A single "they must be equal" assertion would demand the repoint, so it is
  # gone. Recording the registry's values instead keeps the teeth that matter:
  # when the registry moves AGAIN, this job fails and names the new values.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now two-sided:
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      # What this repo pins, ships, and tests against.
      DUCKDB_VERSION: v1.5.6
      # The next line this workflow builds, for compile-compat and for the
      # test-coverage leg. BRANCH name, not the registry's commit -- see
      # duckdb-v2-test-coverage below for why that distinction is load-bearing.
      DUCKDB_NEXT: v2.0-cyanoptera
      # What the community registry builds by default, as of DuckDB 2.0.0 being
      # tagged on 2026-10-20. Recorded so that the registry moving again is a
      # FAILURE here rather than a surprise in a release.
      #
      # THE SHAPE CHANGED with the release, not only the values. The default
      # duckdb_version is a VERSION STRING again, and the commit moved to a
      # separate duckdb_commit input. There is no active duckdb_tag default any
      # more: every one in the registry's build.yml is commented out, and the
      # previous revision of this job read one of those comments and reported it
      # as a live value. A grep cannot tell a comment from a setting, so the
      # parse below strips comment lines first and asserts the ABSENCE of a tag
      # default rather than recording one.
      DUCKDB_REGISTRY_STABLE: v2.0.0
      DUCKDB_REGISTRY_COMMIT: d54cbbe3df17e8e5ce68312f483b4155836112aa
      DUCKDB_REGISTRY_TOOLS: v2.0-cyanoptera
      # scripts/build.py still routes a v1.5.6 build to each descriptor's
      # `variegata` ref -- the line this repo ships. But NOTHING in the
      # registry's build_all.yml asks for a v1.5.6 build any more, and
      # build_andium (v1.4.5) is `if: false`. The route exists with no caller,
      # which is why tracker/features/051 is now a live question.
      DUCKDB_REGISTRY_VARIANT: v1.5.6
      # Flip day keeps a duckdb-legacy-build at the outgoing version for one
      # release; set this to that version then so the stray-literal scan exempts
      # it instead of flagging it. Empty the rest of the time.
      DUCKDB_LEGACY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pin with its tag, and the recorded registry values with the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scans below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          # The build jobs must actually use this job's constants.
          for want_line in "duckdb_version: ${DUCKDB_VERSION}" "duckdb_version: ${DUCKDB_NEXT}"; do
            c=$(grep -c "${want_line}$" "$wf" || true)
            [ "$c" -ge 1 ] || { echo "::error::no build job in this workflow uses ${want_line}; this job's constants have drifted"; exit 1; }
          done
          # NO OTHER DuckDB VERSION LITERAL may drift anywhere else in this file:
          # sibling workflows (yaml, mcp) embed a version in artifact NAMES and CLI
          # download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the greps above cannot see, so
          # a bump left them stale and this job went green over a red build. Comment
          # lines (first non-space char `#`) are exempt, and so are `uses:` lines (a
          # `- uses:` list item too): a third-party action pin like `@v2.0.4` is not a
          # DuckDB version. Branch names like `v2.0-cyanoptera` and `v1.5-variegata`
          # have no third numeric component and so never match. The optional
          # pre-release suffix makes `v2.0.0-alpha46057` match whole rather than
          # reading as `v2.0.0`, while `v1.5.6-extension-wasm_eh` in an artifact name
          # still reads as `v1.5.6`. DUCKDB_LEGACY, when set, is exempt too.
          ver_re='v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev)[0-9.]*)?'
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE "$ver_re" || true); do
              [ "$v" = "$DUCKDB_VERSION" ] && continue
              [ "$v" = "$DUCKDB_REGISTRY_STABLE" ] && continue
              [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ] && continue
              echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION} or the recorded registry stable ${DUCKDB_REGISTRY_STABLE}: derive it from the shipped version or bump it"
              bad=1
            done
          done < <(grep -nE "$ver_re" "$wf" || true)
          # Any 40-hex literal outside comments, `uses:` pins and `vcpkg_commit:`
          # must be the recorded registry commit: a commit bump otherwise leaves a
          # stale sha that the version scan above cannot see.
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*vcpkg_commit:' && continue
            for h in $(printf '%s\n' "$line" | grep -oE '[0-9a-f]{40}' || true); do
              [ "$h" = "$DUCKDB_REGISTRY_COMMIT" ] && continue
              echo "::error::line ${lineno}: ${line} -- a commit literal that is not the recorded registry commit ${DUCKDB_REGISTRY_COMMIT}: derive it or bump it"
              bad=1
            done
          done < <(grep -nE '[0-9a-f]{40}' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY for the registry half is the registry's own files, not this
          # job's constants: a constant checked only against itself passes for a year
          # after the registry moves (panduck, 2026-09-13). Resolve main to a sha
          # first so the raw fetches are not served from the branch cache. THREE
          # degraded paths, deliberately different: UNREACHABLE (curl itself failed,
          # HTTP code 000) is the world being unavailable -> a NOTE, and the summary
          # says the registry assertions were not made; a non-2xx HTTP code (e.g. a
          # renamed/removed registry file) is this check asking a well-formed question
          # and being told no -> a FAILURE naming the code and URL (a bare `curl -sf`
          # would have mistaken this for UNREACHABLE and measured nothing);
          # REACHABLE, 2xx, BUT UNPARSEABLE is this check being wrong about the file's
          # content -> also a FAILURE.
          #
          # FOUR values are parsed, not one. The previous revision parsed only a
          # `'v<semver>'` default out of build.yml, so when #3079 replaced it with a
          # bare commit the parse returned empty and this job failed on the
          # UNPARSEABLE branch -- hiding the real change behind a parse error. The
          # registry's default has taken a tag, a 10-char abbreviated sha and a full
          # 40-char sha within four commits, so each value is parsed in the shape the
          # registry actually writes it.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header":
          # GitHub answers 401 to it, worse than sending no header at all. An
          # unauthenticated local run would then always miss sha resolution and fall
          # back to the `main` REF NAME, comparing against whatever the branch URL's
          # cache happens to be serving -- the exact staleness this step avoids. So
          # the header is added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          url1="${base}/${sha:-main}/.github/workflows/build.yml"
          url2="${base}/${sha:-main}/scripts/build.py"
          f1=$(mktemp); f2=$(mktemp)
          # curl writes 000 to %{http_code} when no HTTP response arrived at all;
          # `|| true` only stops `set -e` from killing the script, leaving curl's
          # own "000" unaltered (a `|| echo 000` would double it to "000000").
          code1=$(curl -s -o "$f1" -w '%{http_code}' "$url1" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "$url2" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; only the local assertions were made"
            mode="NOT checked against the registry (unreachable); local constants only"
          elif [ "${code1#2}" = "$code1" ]; then
            echo "::error::community registry returned HTTP ${code1} for ${url1}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url1}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            echo "::error::community registry returned HTTP ${code2} for ${url2}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url2}" >> "$summary"; exit 1
          else
            # EVERY parse reads a COMMENT-STRIPPED copy. The registry commented out
            # its duckdb_tag defaults when 2.0.0 shipped, and the previous revision
            # grepped one of those comments and reported a live tag -- the check was
            # measuring what the registry had STOPPED doing. Full-line comments only;
            # no value read here carries a trailing comment, and stripping those
            # would have to parse `${{ }}` to be safe.
            live1=$(mktemp); live2=$(mktemp)
            grep -vE '^[[:space:]]*#' "$f1" > "$live1" || true
            grep -vE '^[[:space:]]*#' "$f2" > "$live2" || true
            # FIVE values, in the shapes the registry writes them today.
            # stable and default are parsed separately although both are v2.0.0:
            # they are different settings, and the registry has split them before.
            reg_stable=$(grep -m1 -o "DUCKDB_LATEST_STABLE: *'v[^']*'" "$live1" | grep -o "'v[^']*'" | tr -d "'" || true)
            reg_default=$(grep -m1 -o "DUCKDB_VERSION: \${{ inputs.duckdb_version || 'v[^']*'" "$live1" | grep -o "'v[^']*'$" | tr -d "'" || true)
            reg_commit=$(grep -m1 -oE "duckdb_commit:.*'[0-9a-f]{40}'" "$live1" | grep -oE '[0-9a-f]{40}' || true)
            reg_tools=$(grep -m1 -o "inputs.ci_tools_version || '[^']*'" "$live1" | grep -o "'[^']*'$" | tr -d "'" || true)
            # build.py routes one DUCKDB_VERSION to each descriptor's `variegata`
            # ref; the version sits in the condition on the line before.
            reg_variant=$(grep -B1 "'variegata' in desc" "$live2" | grep -m1 -o "== 'v[0-9.]*'" | grep -o "v[0-9.]*" || true)
            # An ABSENCE, asserted positively: this job records no tag because the
            # registry has no active tag default. If one comes back, the record is
            # incomplete and silence would hide it.
            reg_tag=$(grep -m1 -o "inputs.duckdb_tag || 'v[^']*'" "$live1" | grep -o "'v[^']*'" | tr -d "'" || true)
            if [ -n "$reg_tag" ]; then
              echo "::error::the community registry has an ACTIVE duckdb_tag default again (${reg_tag}) at ${sha:-main}; this job deliberately records none, so add DUCKDB_REGISTRY_TAG back and assert it"
              echo "duckdb-pin: FAILED, registry re-added a duckdb_tag default (${reg_tag})" >> "$summary"; exit 1
            fi
            if [ -z "$reg_stable" ] || [ -z "$reg_default" ] || [ -z "$reg_commit" ] || [ -z "$reg_tools" ] || [ -z "$reg_variant" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build.py carry no recognisable defaults (stable='${reg_stable}', default='${reg_default}', commit='${reg_commit}', ci-tools='${reg_tools}', variant='${reg_variant}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            registry="${reg_stable}/${reg_default}/${reg_commit}/${reg_tools}/${reg_variant}"
            recorded="${DUCKDB_REGISTRY_STABLE}/${DUCKDB_REGISTRY_STABLE}/${DUCKDB_REGISTRY_COMMIT}/${DUCKDB_REGISTRY_TOOLS}/${DUCKDB_REGISTRY_VARIANT}"
            if [ "$registry" != "$recorded" ]; then
              echo "::error::the community registry now builds stable/default/commit/ci-tools/variant ${registry} (at ${sha:-main}) but this workflow records ${recorded}; update the DUCKDB_REGISTRY_* constants, and reconsider tracker/features/051 -- the registry has moved again"
              echo "duckdb-pin: FAILED, registry ${registry} vs recorded ${recorded}" >> "$summary"; exit 1
            fi
            # Informational, not a gate: is the registry's pinned commit actually
            # the release it names? A registry that pins a post-release commit is a
            # legitimate choice, so this reports rather than fails -- but an
            # unnoticed drift between the two is how a record becomes misleading.
            want_stable=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${reg_stable}^{}" | cut -f1)
            [ -n "$want_stable" ] || want_stable=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${reg_stable}" | cut -f1)
            if [ "$want_stable" = "$reg_commit" ]; then
              ident="the ${reg_stable} release commit"
            else
              ident="NOT the ${reg_stable} tag (${want_stable:0:10})"
            fi
            # The divergence this repo knowingly carries, restated every run so it
            # cannot become invisible: we pin and ship ${DUCKDB_VERSION}, while the
            # registry's default is ${reg_stable} and NO job in its build_all.yml
            # asks for ${DUCKDB_VERSION} any more.
            mode="registry verified at ${sha:-main}: default ${reg_stable} at ${reg_commit:0:10} (${ident}) on ${reg_tools}, variant ${reg_variant}; THIS REPO SHIPS ${DUCKDB_VERSION}, which the registry no longer builds by default (declared divergence, tracker/features/051)"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; jobs ship ${DUCKDB_VERSION} and ${DUCKDB_NEXT}; ${mode}" | tee -a "$summary"

  embedded-header-sync:
    name: Embedded SQL macros header in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate embedded_sql_macros.hpp from src/sql_macros/*.sql
        run: python3 scripts/embed_sql_macros.py
      - name: Verify committed header matches
        run: |
          if ! git diff --exit-code -- src/include/embedded_sql_macros.hpp; then
            echo '::error file=src/include/embedded_sql_macros.hpp::embedded_sql_macros.hpp is out of sync with src/sql_macros/*.sql. Run `python3 scripts/embed_sql_macros.py` and commit the regenerated header alongside the .sql change.'
            exit 1
          fi

  # The taxonomy tables — the semantic_type codes and names, the node flag byte,
  # and the name/native extraction strategy enums — are generated from
  # spec/taxonomy/taxonomy.yaml into marked blocks in five sources (v2.0 M1
  # "the contract", tracker/features/044-v2-m1-contract.md). Unlike the SQL
  # macros, NOTHING in the build regenerates them, so a spec-only commit, or a
  # hand-edit inside a generated block, would ship C++ that disagrees with the
  # spec — which is the hand-sync drift this codegen exists to retire. This
  # check makes that divergence a hard CI failure.
  taxonomy-tables-sync:
    name: taxonomy tables in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PyYAML is available
        # Present in the runner image's system Python; installed only if not,
        # so the job does not depend on pip being usable.
        run: python3 -c "import yaml" || python3 -m pip install --break-system-packages pyyaml
      - name: Regenerate the taxonomy tables from spec/taxonomy/taxonomy.yaml
        run: python3 scripts/generate_taxonomy.py
      - name: Verify the committed tables match
        run: |
          if ! git diff --exit-code -- src/include/semantic_types.hpp src/semantic_types.cpp src/include/node_config.hpp src/language_config_json.cpp src/ast_type_map_function.cpp; then
            echo '::error file=spec/taxonomy/taxonomy.yaml::the generated taxonomy tables are out of sync with spec/taxonomy/taxonomy.yaml. Run `python3 scripts/generate_taxonomy.py` and commit the regenerated sources alongside the spec change.'
            exit 1
          fi

  # docs/reference/languages/*.md is GENERATED from src/language_configs/*_types.def
  # by docs/scripts/generate_language_reference.py. Nothing in the build
  # regenerates it, so a .def change without a regeneration ships a reference
  # page that disagrees with the code.
  #
  # The input is checked as well as the output, and that order matters. The
  # generator matches DEF_TYPE with a SINGLE-LINE regex
  # (generate_language_reference.py:149), so an entry wrapped across two lines
  # silently vanishes from the generated node-type table. PR #280 did exactly
  # that and deleted the whole python comprehension table. A diff check alone
  # cannot catch it, because regenerating and committing the table-less page
  # makes the diff clean again.
  language-reference-sync:
    name: Generated language references in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every DEF_TYPE entry closes on its own line
        run: python3 scripts/check_def_type_single_line.py
      - name: Regenerate the language references from src/language_configs/*_types.def
        run: python3 docs/scripts/generate_language_reference.py
      - name: Verify the committed references match
        run: |
          if ! git diff --exit-code -- docs/reference/languages/; then
            echo '::error file=docs/reference/languages/index.md::the generated language references are out of sync with src/language_configs/*_types.def. Run `python3 docs/scripts/generate_language_reference.py` and commit the regenerated pages alongside the .def change.'
            exit 1
          fi

  # Guard for issue #82: a from-source dev build (no OVERRIDE_GIT_DESCRIBE)
  # must produce an extension that LOADs in the bundled dev shell. During
  # sitting_duck's LoadInternal, core_functions is NOT available: sitting_duck
  # is loaded first at startup (extension_config.cmake order), and the
  # best-effort autoload resolves ~/.duckdb/extensions/<version stamp>/... —
  # empty on a fresh runner, and nonexistent for dev-stamped builds on dev
  # machines. Anything that binds at CREATE MACRO time (scalar macro bodies;
  # e.g. bitwise `&`/`|`/`<<`, or the `list()` aggregate, all core_functions-
  # only on DuckDB v1.5+) aborts registration and makes LOAD fail. Table-macro
  # bodies bind at use time, when core_functions is available in any practical
  # shell. This job proves the README "test it works" one-liner holds for
  # exactly such a build.
  from-source-load:
    name: From-source dev build LOADs without core_functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build release WITHOUT OVERRIDE_GIT_DESCRIBE
        run: GEN=ninja make release
      - name: LOAD the extension in the bundled dev shell (README one-liner)
        run: |
          ./build/release/duckdb -c "LOAD './build/release/extension/sitting_duck/sitting_duck.duckdb_extension'; SELECT COUNT(*) FROM read_ast('README.md');"
      - name: Confirm core_functions was not needed (bitwise ops absent or autoloaded later)
        run: |
          # The dev shell auto-loads sitting_duck at startup; if macro
          # registration needed core_functions this command would have failed
          # before -c even ran. Record what the shell reports for diagnosis.
          ./build/release/duckdb -c "SELECT extension_name, loaded FROM duckdb_extensions() WHERE extension_name IN ('sitting_duck','core_functions');"
  # Built-in languages are compile-time modules selected via
  # -DSITTING_DUCK_LANGUAGES / -DSITTING_DUCK_EXCLUDE_LANGUAGES (groundwork for
  # grammar packs / sitting_duckling, issue #87). The default legs above always
  # build all languages, so this job keeps the subset path honest: build a
  # two-language subset and verify that compiled-in languages parse, compiled-out
  # languages fail exactly like unknown ones, and ast_supported_languages()
  # reflects the subset.
  language-subset-build:
    name: Language subset build (python;cpp)
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      OVERRIDE_GIT_DESCRIBE: v1.5.6
      EXT_FLAGS: -DSITTING_DUCK_LANGUAGES="python;cpp"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout required submodules
        # Pre-generated parsers are committed, so grammar submodules are not needed
        run: git submodule update --init duckdb extension-ci-tools third_party/tree-sitter
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build subset
        run: make release
      - name: Smoke test subset behavior
        run: ./scripts/test_language_subset.sh build/release/duckdb

  # Runtime grammar registration (register_language) is exercised only by the
  # test/sql/dynamic_languages/ suite, which is gated behind
  # `require-env SITTING_DUCK_TEST_GRAMMAR_DIR`. The default distribution legs
  # never set that variable, so those tests are skipped there and the feature
  # would otherwise ship with zero CI coverage. This job builds the standalone
  # tree-sitter grammar library (make test-grammar-lib) and runs the full test
  # suite with the variable set, so the require-env tests actually execute.
  runtime-grammar-tests:
    name: Runtime grammar registration tests
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      OVERRIDE_GIT_DESCRIBE: v1.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Checkout required submodules
        # Pre-generated parsers are committed, so grammar submodules are not needed
        run: git submodule update --init duckdb extension-ci-tools third_party/tree-sitter
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build release
        run: make release
      - name: Build the dynamic grammar test library
        run: make test-grammar-lib
      - name: Run the test suite with the runtime-grammar tests enabled
        run: SITTING_DUCK_TEST_GRAMMAR_DIR=build/test_grammars make test

  # Canary: BUILDS against DuckDB v2.0-cyanoptera (what duckdb/community-extensions'
  # `test_against_latest` runs on every release PR), and is the forward-compat
  # early-warning that catches API/compile breaks against the next DuckDB line.
  # Can also be driven on demand:
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  # Promoted 2026-09-13 (Teague's dual-line ruling): runs on pull_request too
  # (once per PR, see the gate comment on `if:` below), not just push-to-main
  # or dispatch. Use `if:` and not `continue-on-error:` -- a job calling a
  # reusable workflow accepts only a fixed key set, and `continue-on-error`
  # makes the whole workflow fail to parse, scheduling zero jobs.
  #
  # `skip_tests: true` (2026-09-22, Teague's ruling): the TEST phase is disabled
  # on this leg. sitting_duck's ast_select tests time out under DuckDB v2.0's
  # planner regression -- a super-linear-with-statement-size planning cost that
  # is an UPSTREAM DuckDB bug (reported: duckdb/duckdb#26036), reproduces on both
  # v2.0-cyanoptera and duckdb main, and is NOT a sitting_duck defect. Rather than
  # maintain fragile per-file test splits sized against a moving upstream number,
  # we keep the COMPILE-compat signal (which is what matters for "does it build on
  # v2.0") and drop the test-timeout noise. Re-enable tests (drop skip_tests) when
  # #26036 is fixed upstream or the C++ selector engine lands.
  duckdb-next-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    # Gated to run once, not twice, per PR: a push to a PR branch fires both a
    # push run and a pull_request run for the same commit, so an ungated job
    # would build it twice. Runs on PRs, on push to main, and on dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: sitting_duck
      skip_tests: true

      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require sitting_duck` turns "could not load" into `require sitting_duck: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require sitting_duck\" \"test/*\""}}'
  # THE ONLY SOURCE OF TEST EVIDENCE ON THE 2.0 LINE. Not an artifact source --
  # nothing here is shipped, and it is Linux-only to keep the cost down.
  #
  # WHY IT EXISTS: this repo has had NO test signal on the 2.0 line from any
  # source. duckdb-next-build above passes `skip_tests: true`, and in
  # ci-tools @main that input is honoured inside scripts/ci_phase.py:795 rather
  # than by an `if:` on the step -- so its step named "Test" RUNS, prints
  # "Tests skipped by workflow input.", and reports SUCCESS having executed
  # nothing. The community registry's own builds are no better: since #3079 every
  # test file there skips on `require <ext>` and the harness still prints
  # "all tests passed" (measured on sitting_duck 0/156 and duck_hunt 0/61;
  # reported as duckdb/community-extensions#3086). A green check on either is
  # compile evidence only.
  #
  # WHY THE BRANCH NAME AND NOT THE REGISTRY'S COMMIT. Measured in a sibling repo
  # (teaguesterling/duckdb_webbed), same workflow, same ci_tools_version: main,
  # adjacent jobs, these two inputs differing:
  #   duckdb_version: v2.0-cyanoptera, no duckdb_tag  -> ran tests: 123 passed, 0 skipped
  #   duckdb_version: b15358c371daf..., duckdb_tag set -> ran tests: 0 passed, 123 skipped
  # (jobs 116658916531 and 116754207824). The working leg really does build the
  # 2.0 line -- it checks duckdb out to v2.0-cyanoptera off its v1.5.6 submodule
  # pin and reports `version v2.0-cyanoptera, git hash 9a97642349`.
  #
  # The ROUTE from that input to an unloadable extension is NOT established, and
  # two candidate explanations have already been wrong: the ci-tools TEST_RUNNER
  # wrapper (confounded -- #3079 changed the runner AND the version form at once)
  # and artifact naming (impossible -- the artifact name is computed at Upload,
  # which runs AFTER Test). The best current candidate is that the version string
  # becomes DuckDB's version-keyed extension folder: the working leg reports
  # `extension folder v2.0-cyanoptera`, the broken one
  # `extension folder b15358c371daf10dad799a43b6167f6ccdce84d8`. Untraced.
  #
  # THE COST, stated: this tests the cyanoptera TIP, not the exact commit the
  # registry ships. duckdb-next-build covers that commit's compile. Read this
  # job's result as `ran tests: N passed` in the log -- N == 0 means no coverage,
  # whatever colour the check is.
  #
  # EXPECT IT TO BE SLOW, possibly very. tracker/bugs/040 measures ~27x
  # ast_select planning cost on the 2.0 line (upstream duckdb/duckdb#26036);
  # css_selectors_multilang.test alone took 2060s locally there against 162s on
  # v1.5.6. If this job hits the runner limit, split the selector files rather
  # than reaching for skip_tests -- a job that reports success having run nothing
  # is the exact failure this leg exists to end.
  duckdb-v2-test-coverage:
    name: Build extension binaries (v2.0 test coverage)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    # Same gate as duckdb-next-build: once per PR, on push to main, and on dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: sitting_duck
      # Deliberately NO skip_tests: running the tests is the entire point.
      # Deliberately NO duckdb_tag: it is one of the two values that differ in the
      # measurement above, and the working leg had it empty.
      exclude_archs: 'windows_amd64;windows_amd64_mingw;osx_amd64;osx_arm64;wasm_mvp;wasm_eh;wasm_threads;linux_arm64'


      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require sitting_duck` turns "could not load" into `require sitting_duck: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require sitting_duck\" \"test/*\""}}'
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: sitting_duck
      # Windows was excluded here from the v1.5.4 era, on the grounds that both
      # Windows legs failed while the same source passed Linux/macOS/wasm. That
      # exclusion is now stale: the community registry builds sitting_duck for
      # windows_amd64 AND windows_amd64_mingw, and both were green on PR #2722
      # (v1.5.5). Excluding them here meant this repo could not see a Windows
      # break until the registry did, and left the compat shims -- which lean on
      # overload resolution and SFINAE, exactly where MSVC differs -- with no
      # in-repo MSVC coverage at all.
      #
      # If Windows genuinely breaks again, fix it or re-exclude it WITH THE
      # ERROR RECORDED HERE. A bare exclusion outlives the reason for it.

