  - name: NAME_QUALIFIED
    kind: NAME
    offset: 0x04
    description: "qualified names (obj.prop)"
  - name: NAME_SCOPED
    kind: NAME
    offset: 0x08
    description: "scoped references (::, this, super, @instance_var)"
  - name: NAME_ATTRIBUTE
    kind: NAME
