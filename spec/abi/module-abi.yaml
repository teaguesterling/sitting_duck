    - {check: dispatch, language: sql, literal: "select_statement"}   # sql_native_extractors.hpp:70
    - {check: dispatch, language: sql, literal: "string_literal"}   # sql_native_extractors.hpp:702
    - {check: dispatch, language: sql, literal: "table_reference"}   # sql_native_extractors.hpp:694
    - {check: dispatch, language: sql, literal: "text"}   # sql_native_extractors.hpp:174
    - {check: dispatch, language: sql, literal: "update_statement"}   # sql_native_extractors.hpp:78
    - {check: dispatch, language: swift, literal: "access_level_modifier"}   # swift_native_extractors.hpp:211
    - {check: dispatch, language: swift, literal: "closure_parameters"}   # swift_native_extractors.hpp:263
