#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE PIN EQUALS THE SHIPPED TAG. Fleet rule (Teague, 2026-09-13): the duckdb
  # submodule is pinned at exactly the commit of the tag the stable build ships
  # against, which is also the version the community registry builds every
  # extension with. Otherwise local builds and each repo's own CI artifacts carry a
  # different DuckDB than the served one, and extensions built in different repos
  # cannot co-load locally (the ABI is exact-version). Measured 2026-09-13: five
  # sibling repos were on a July dev commit, one on a v1.5.6-dev commit, one on
  # DuckDB main. Nothing but a check keeps this true. The second assertion keeps
  # this job's constant from drifting away from the `duckdb_version:` the build
  # jobs above actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the tag's commit
        run: |
          set -eu
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" .github/workflows/MainDistributionPipeline.yml)
          [ "$n" -ge 1 ] || { echo "::error::no build job in this workflow ships duckdb_version: ${DUCKDB_VERSION}; this job's constant has drifted"; exit 1; }
          # The AUTHORITY is the registry's own default, not this job's constant: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetch is
          # not served from the branch cache. TWO degraded paths, deliberately different:
          # UNREACHABLE is the world being unavailable -> a NOTE, and the summary says
          # the assertion was not made; REACHABLE BUT UNPARSEABLE is this check being
          # wrong about the file (renamed input, moved default) -> a FAILURE, because
          # only the check can fix that and a green run measuring nothing is the way
          # this class of check rots (panduck again).
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          sha=$(curl -sf https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          if body=$(curl -sf "https://raw.githubusercontent.com/duckdb/community-extensions/${sha:-main}/.github/workflows/build.yml"); then
            registry=$(printf '%s' "$body" | grep -m1 -o "inputs.duckdb_version || 'v[0-9][0-9.]*'" | grep -o "'v[0-9][0-9.]*'" | tr -d "'" || true)
            if [ -z "$registry" ]; then
              echo "::error::community-extensions build.yml at ${sha:-main} was fetched but has no \"inputs.duckdb_version || 'vX.Y.Z'\" default; this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry file fetched but unparseable" >> "$summary"; exit 1
            elif [ "$registry" != "$DUCKDB_VERSION" ]; then
              echo "::error::the community registry builds at ${registry} (build.yml default at ${sha:-main}) but this repo ships and pins ${DUCKDB_VERSION}; the served artifact and the local build differ"
              echo "duckdb-pin: FAILED, registry builds ${registry}, repo pins ${DUCKDB_VERSION}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (${registry} at ${sha:-main})"
          else
            echo "::notice::could not reach the community registry; the pin was checked against the local constant only"
            mode="NOT checked against the registry (unreachable); local constant ${DUCKDB_VERSION} only"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; ${n} build job(s) ship it; ${mode}" | tee -a "$summary"

  # The committed src/include/embedded_sql_macros.hpp must match regeneration
  # from src/sql_macros/*.sql. The build regenerates it when Python3 is present
  # (CMake only WARNS on failure), so source builds without Python3 use the
  # committed copy verbatim — a .sql-only commit silently ships stale macros to
  # those builds (this happened: main shipped without #74's LIKE escaping).
  # This check makes that divergence a hard CI failure.
  embedded-header-sync:
    name: Embedded SQL macros header in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate embedded_sql_macros.hpp from src/sql_macros/*.sql
        run: python3 scripts/embed_sql_macros.py
      - name: Verify committed header matches
        run: |
          if ! git diff --exit-code -- src/include/embedded_sql_macros.hpp; then
            echo '::error file=src/include/embedded_sql_macros.hpp::embedded_sql_macros.hpp is out of sync with src/sql_macros/*.sql. Run `python3 scripts/embed_sql_macros.py` and commit the regenerated header alongside the .sql change.'
            exit 1
          fi

  # Guard for issue #82: a from-source dev build (no OVERRIDE_GIT_DESCRIBE)
  # must produce an extension that LOADs in the bundled dev shell. During
  # sitting_duck's LoadInternal, core_functions is NOT available: sitting_duck
  # is loaded first at startup (extension_config.cmake order), and the
  # best-effort autoload resolves ~/.duckdb/extensions/<version stamp>/... —
  # empty on a fresh runner, and nonexistent for dev-stamped builds on dev
  # machines. Anything that binds at CREATE MACRO time (scalar macro bodies;
  # e.g. bitwise `&`/`|`/`<<`, or the `list()` aggregate, all core_functions-
  # only on DuckDB v1.5+) aborts registration and makes LOAD fail. Table-macro
  # bodies bind at use time, when core_functions is available in any practical
  # shell. This job proves the README "test it works" one-liner holds for
  # exactly such a build.
  from-source-load:
    name: From-source dev build LOADs without core_functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build release WITHOUT OVERRIDE_GIT_DESCRIBE
        run: GEN=ninja make release
      - name: LOAD the extension in the bundled dev shell (README one-liner)
        run: |
          ./build/release/duckdb -c "LOAD './build/release/extension/sitting_duck/sitting_duck.duckdb_extension'; SELECT COUNT(*) FROM read_ast('README.md');"
      - name: Confirm core_functions was not needed (bitwise ops absent or autoloaded later)
        run: |
          # The dev shell auto-loads sitting_duck at startup; if macro
          # registration needed core_functions this command would have failed
          # before -c even ran. Record what the shell reports for diagnosis.
          ./build/release/duckdb -c "SELECT extension_name, loaded FROM duckdb_extensions() WHERE extension_name IN ('sitting_duck','core_functions');"
  # Built-in languages are compile-time modules selected via
  # -DSITTING_DUCK_LANGUAGES / -DSITTING_DUCK_EXCLUDE_LANGUAGES (groundwork for
  # grammar packs / sitting_duckling, issue #87). The default legs above always
  # build all languages, so this job keeps the subset path honest: build a
  # two-language subset and verify that compiled-in languages parse, compiled-out
  # languages fail exactly like unknown ones, and ast_supported_languages()
  # reflects the subset.
  language-subset-build:
    name: Language subset build (python;cpp)
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      OVERRIDE_GIT_DESCRIBE: v1.5.4
      EXT_FLAGS: -DSITTING_DUCK_LANGUAGES="python;cpp"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout required submodules
        # Pre-generated parsers are committed, so grammar submodules are not needed
        run: git submodule update --init duckdb extension-ci-tools third_party/tree-sitter
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build subset
        run: make release
      - name: Smoke test subset behavior
        run: ./scripts/test_language_subset.sh build/release/duckdb

  # Runtime grammar registration (register_language) is exercised only by the
  # test/sql/dynamic_languages/ suite, which is gated behind
  # `require-env SITTING_DUCK_TEST_GRAMMAR_DIR`. The default distribution legs
  # never set that variable, so those tests are skipped there and the feature
  # would otherwise ship with zero CI coverage. This job builds the standalone
  # tree-sitter grammar library (make test-grammar-lib) and runs the full test
  # suite with the variable set, so the require-env tests actually execute.
  runtime-grammar-tests:
    name: Runtime grammar registration tests
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      OVERRIDE_GIT_DESCRIBE: v1.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Checkout required submodules
        # Pre-generated parsers are committed, so grammar submodules are not needed
        run: git submodule update --init duckdb extension-ci-tools third_party/tree-sitter
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build release
        run: make release
      - name: Build the dynamic grammar test library
        run: make test-grammar-lib
      - name: Run the test suite with the runtime-grammar tests enabled
        run: SITTING_DUCK_TEST_GRAMMAR_DIR=build/test_grammars make test

  # Canary: builds AND tests against DuckDB main (the v2.0 line), which is what
  # duckdb/community-extensions' `test_against_latest` runs on every release PR.
  # Gated rather than disabled, so a port can drive it on demand:
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  # It must not run on pull_request: a push and a PR both fire on the same commit
  # and a PR's check rollup includes both, so an ungated canary shows red on every
  # PR. Use `if:` and not `continue-on-error:` -- a job calling a reusable workflow
  # accepts only a fixed key set, and `continue-on-error` makes the whole workflow
  # fail to parse, scheduling zero jobs.
  duckdb-next-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: sitting_duck

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: sitting_duck
      # Windows stays excluded (fleet pattern): both Windows legs fail on
      # v1.5.4 while the same source passes Linux/macOS/wasm. Windows is not
      # a merge gate; re-enable once the Windows build is fixed.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

