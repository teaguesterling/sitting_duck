    - {check: table, language: r, literal: "namespace_get_internal"}   # function_call_extractor.hpp:213
    - {check: table, language: ruby, literal: "chained_call"}   # function_call_extractor.hpp:180
    - {check: table, language: ruby, literal: "method_call"}   # function_call_extractor.hpp:180
    - {check: table, language: rust, literal: "method_call_expression"}   # function_call_extractor.hpp:132
