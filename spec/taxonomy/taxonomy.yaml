  - name: TYPE_GENERIC
    kind: TYPE
    offset: 0x0C
    description: "generic/template types"
  - name: OPERATOR_ARITHMETIC
    kind: OPERATOR
    offset: 0x00
    description: "+, -, *, /, %, **, //, &, |, ^, ~, <<, >>"
  - name: OPERATOR_LOGICAL
    kind: OPERATOR
    offset: 0x04
    description: "&&, ||, !, and, or, not, ? :"
  - name: OPERATOR_COMPARISON
    kind: OPERATOR
