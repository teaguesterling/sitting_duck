  - name: EXTERNAL_FOREIGN
    kind: EXTERNAL
    offset: 0x08
    description: "foreign function interface"
  - name: EXTERNAL_EMBED
    kind: EXTERNAL
    offset: 0x0C
    description: "embedded content (HTML, CSS, SQL)"
  - name: LITERAL_NUMBER
    kind: LITERAL
    offset: 0x00
    description: "integers, floats, decimals"
  - name: LITERAL_STRING
    kind: LITERAL
    offset: 0x04
    description: "strings, chars, text"
  - name: LITERAL_ATOMIC
    kind: LITERAL
    offset: 0x08
