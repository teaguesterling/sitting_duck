# Layout invariants for the v2 M2 move (tracker/features/054).
#
# WHY THIS FILE EXISTS
# --------------------
# tracker/features/044-v2-m1-contract.md:22 names a safety net for M2:
#
#     "Safety net for later (M2): the #92 invariance test -- default build
#      byte-equivalent, canonical registration order -- must stay green
#      throughout."
#
# Measured 2026-11-03: that test did not exist. PR #92 is compile-time language
# selection, the feature; its 8 files contain no test. A content grep for
# `registration order`, `byte.?equivalen` and `canonical order` across test/,
# .github/ and scripts/ returned nothing. A gate that nothing asserts cannot
# "stay green" -- it was never red.
#
# This file is the authority the gate reads. scripts/verify_layout_invariance.py
# compares the tree against it.
#
# WHAT M2 CHANGES HERE
# --------------------
# Stage 1 of M2 moves per-language sources into languages/<lang>/. That changes
# the four `paths` templates below and NOTHING else in this file. The ordered
# list, the exceptions and the denominator are properties of the project, not
# of where its files sit -- which is exactly what makes them useful across the
# move.
version: 1.0.0

# Where per-language sources live today. `{language}` is the registered name;
# `{grammar}` is the grammar directory suffix, which differs for csharp.
paths:
  adapter: "languages/{language}/{language}_adapter.cpp"
  definitions: "languages/{language}/{language}_types.def"
  grammar: "grammars/tree-sitter-{grammar}"
  # Since M2 stage 2 each language declares itself here, and the declaration
  # table below only LISTS the modules, in registration order. The gate reads
  # the order from that list and then reads every module, because a list is an
  # index and a module is the artifact.
  module: "languages/{language}/module.cmake"
  declaration_table: "cmake/BuiltinLanguages.cmake"
  # Where the build READS parser sources from. CMakeLists.txt sets
  # PARSER_SOURCE_DIR to this directory whenever the canary
  # tree-sitter-c/src/parser.c is present, which is every default build, and a
  # module's PARSERS paths are resolved against it. Committed on purpose: the
  # `Runtime grammar registration tests` CI job builds with only the duckdb,
  # extension-ci-tools and third_party/tree-sitter submodules checked out, so a
  # module whose PARSERS escape this directory breaks a build that has no
  # grammar submodule at all.
  pregenerated_parsers: "generated_parsers"
  # The second register of the same fact. scripts/audit_*.py resolve a language
  # to its parser through THIS file, not through module.cmake, so a language
  # missing here is skipped by every audit -- green and empty, not failing.
  parser_manifest: "generated_parsers/MANIFEST"
  # Emitted into the build tree by cmake/BuiltinLanguages.cmake. Checked only
  # when a build is present, so this gate still runs on a bare checkout.
  generated_table: "extension/sitting_duck/sitting_duck_generated/sitting_duck_builtin_languages.def"

# CANONICAL REGISTRATION ORDER.
#
# Declaration order in cmake/BuiltinLanguages.cmake IS registration order; the
# file says so, and re-sorts a user-supplied subset into it so that a subset
# build registers in the same relative order as a full build.
#
# `ast_supported_languages()` does NOT preserve this order. Measured
# 2026-11-03: the same 28 languages come back as
#   graphql lua kotlin bash zig json csharp rust toml c python javascript html
#   r swift cpp dart sql typescript ruby java hcl php duckdb go markdown yaml css
# which looks like hash-map iteration order. So a test that reads order from
# that function pins a hash order and passes whatever happens to registration.
# This list is the only authority.
registration_order:
  - python
  - javascript
  - cpp
  - typescript
  - sql
  - duckdb
  - go
  - ruby
  - markdown
  - java
  - php
  - html
  - css
  - c
  - rust
  - json
  - bash
  - swift
  - r
  - kotlin
  - csharp
  - lua
  - hcl
  - graphql
  - toml
  - zig
  - dart
  - yaml
  - tsx

# THE SQL MACRO MANIFEST.
#
# This list IS the registration order of src/sql_macros/*.sql, and
# scripts/embed_sql_macros.py reads it to build the embedded header. It used to
# be a hardcoded list inside that script.
#
# Order is load-bearing, not cosmetic: scalar macros bind their callees eagerly,
# and five files call macros from semantic_predicates.sql, so it registers
# first. Moving it down fails at load time, not at query time.
#
# `side` says which half of the M2 stage 3 split a file belongs to: `core` is
# language-agnostic, `addon` is opinionated. A build that keeps only one side
# FILTERS this list and keeps the relative order of what is left. It does not
# re-sort, so a subset needs no ordering rule of its own -- the same precedent
# as `registration_order` above. scripts/verify_macro_boundary.py reads `side`
# and fails if a `core` macro reaches an `addon` one; load_manifest() rejects
# any value other than `core` or `addon`.
sql_macros:
  - {file: semantic_predicates.sql, side: core}
  - {file: file_utilities.sql, side: core}
  - {file: tree_navigation.sql, side: core}
  - {file: tree_analysis.sql, side: addon}
  - {file: pattern_matching.sql, side: addon}
  - {file: relational_operators.sql, side: core}
  - {file: parse_ast_list_table.sql, side: core}
  - {file: css_selectors.sql, side: addon}
  - {file: selector_for.sql, side: addon}
  - {file: ast_select_rules.sql, side: addon}
  - {file: scope_resolution.sql, side: addon}
  - {file: duck_blocks.sql, side: addon}
  - {file: ast_patch.sql, side: addon}
  - {file: ast_unparse.sql, side: core}

# Languages whose files do not follow the `paths` templates. Every entry is a
# measured irregularity, not a convenience.
exceptions:
  sql:
    definitions: none   # its 233 DEF_TYPE entries are inlined in sql_adapter.cpp
    reason: "declaration table lives in the adapter translation unit"
  duckdb:
    definitions: none
    grammar: none       # parses through DuckDB's own parser, not tree-sitter
    reason: "native adapter; the 28th language and the only non-tree-sitter one"
  csharp:
    grammar: "c-sharp"  # grammars/tree-sitter-c-sharp, not -csharp
    reason: "upstream grammar repository name differs from the registered name"
  tsx:
    definitions: none   # no tsx_types.def of its own
    # ...because TSXAdapter inherits TypeScriptAdapter's table, literally the
    # same static map. `definitions: none` says "no file named for this
    # language"; this says WHERE the table actually is, which is a different
    # fact and the one every source scan needs.
    #
    # Tools attribute a DEF_TYPE row to a language by its FILE'S BASENAME, so
    # without this line tsx reads as a language with no declarations at all.
    # Measured 2026-11-13: conformance_kit.sh reported tsx UNDECL on NATIVE-ABST
    # and DECL-UNIQUE ("no .def reachable for this language"), which is a gate
    # that passes because it did not look.
    definitions_from: typescript
    grammar: "typescript"  # tree-sitter-typescript ships the tsx grammar beside typescript
    reason: "TypeScript with JSX: typescript's adapter and declarations, the tsx grammar"
  yaml:
    regenerates: false
    reason: >-
      Its grammar.js post-processes the output of grammar() --
      `module.exports = global_alias(global_alias(module.exports, {...}))` --
      which reads grammar_json.rules as undefined and throws under this tree's
      tree-sitter CLI and Node. So scripts/generate_all_parsers.sh cannot list
      it and generated_parsers/tree-sitter-yaml/ holds the parser the grammar
      shipped (ABI 13, C++ scanner). See #233. This is the ONLY language whose
      committed parser is not reproducible from its pin: measured 2026-11-13,
      the other 27 regenerate byte-identically.

# Declaration tables that belong to no registered language. These are the
# condition yaml was in before #227 wired it up: a .def with no adapter.
# Listed so that the gate's file counts are exact rather than approximate.
unregistered_definitions:
  - fsharp
  - haskell
  - julia
  - scala

# Adapter translation units that sit UNDER the languages glob but are not one
# language's module. Empty since 054 M2 stage 1: the only such file was
# dynamic_language_adapter.cpp, which stayed on the engine side of the move and
# is therefore outside the glob entirely. It is listed under `engine_adapters`
# instead.
not_a_language: []

# Adapter translation units that deliberately did NOT move into languages/.
# They are engine code, not language modules, and M3 extracts them with the
# engine. Listed with full paths and checked for existence, so that deleting or
# moving one is a finding rather than a silent drop out of every count.
engine_adapters:
  - path: "src/language_adapters/dynamic_language_adapter.cpp"
    reason: "implements LanguageAdapter from DATA (register_language); not one language"
  - path: "src/language_adapters/duckdb_adapter_backup.cpp"
    reason: "dead: the build never compiles it (#226). Does not match *_adapter.cpp."

# THE CONFORMANCE KIT'S DENOMINATOR.
#
# scripts/conformance_kit.sh scans DEFAULT_DEF_SOURCES:
#     ${repo_root}/src/language_configs/*_types.def
#     ${repo_root}/src/language_adapters/*_adapter.cpp
# After the M2 move those globs match zero files. A language whose declarations
# the kit cannot read is reported UNDECL, not FAIL -- so the kit goes blind and
# STAYS GREEN. That is the failure this section exists to prevent.
#
# Floors, not equalities. `files_min` and `languages_with_tables_min` sit AT the
# measured value, because a drop in either means a glob broke or a table became
# unreadable -- neither happens on purpose. `def_type_entries_min` sits well
# below the measured value, because declarations are deleted deliberately (#232
# removed 315 of them in one PR); its job is to catch a collapse, not to pin a
# count.
#
# MEASURED WITH scripts/verify_layout_invariance.py, NOT with the kit.
# The kit's header reports 3837 entries for this same tree. That is a different
# measurement, not a disagreement: the kit counts rows it parsed into four
# fields and drops the `raw_type` placeholder and arglists shorter than five
# arguments, while this gate counts raw DEF_TYPE macro invocations. Copying the
# kit's 3837 in here would be a floor nothing here measures -- and a floor set
# 200 below the true value is 200 of slack nobody intended.
kit_denominator:
  # 58 = 30 *_types.def (26 registered + 4 unregistered) + 28 *_adapter.cpp.
  #
  # Was 59 before 054 M2 stage 1, when the globs were src/language_configs and
  # src/language_adapters. The move took it to 58 because
  # dynamic_language_adapter.cpp stayed on the engine side and so left the
  # glob's scope. That file holds zero DEF_TYPE entries, which is why the other
  # two counts did NOT move: entries stayed at 4039 and readable tables at 31,
  # measured either side of the move. The gate forced this one-file drop to be
  # explained rather than absorbed, which is the whole point of a floor.
  files_min: 58
  def_type_entries_min: 3500      # measured 4039, deduped by language
  languages_with_tables_min: 31   # 26 registered with .def + 4 unregistered + sql's inline;
                                  # duckdb is the one language with no readable table at all
