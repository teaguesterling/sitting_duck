    # comment cannot fit on one line); recorded so the generated header stays
    # byte-identical to the committed, clang-format-clean source.
    layout: break_after_assign
    description: "structural containers (source_file/program/compilation_unit roots) — distinct from DEFINITION_MODULE, which tags named module/namespace definitions within the file"
# ---------------------------------------------------------------------------
# The node flag byte (ASTNodeFlags)
# ---------------------------------------------------------------------------
# Eight orthogonal bits carried alongside every node's semantic_type. `fields`
# is in bit order and fully determines the byte layout; `kind: bit` is a single
# boolean bit, `kind: enum` is a multi-bit mutually exclusive role.
#
# runtime_selectable marks the names a runtime language config (register_language)
# may name in its "flags" array — masks, the zero NAME_NONE sentinel and the
# deprecated aliases are not selectable.
flag_byte:
  namespace: ASTNodeFlags
  fields:
    - name: IS_SYNTAX_ONLY
      kind: bit
      bits: [0]
      value: 0x01
      summary: "Bit 0: syntax token"
      doc: "pure syntax token (keyword, punctuation)"
      runtime_selectable: true

    - name: NAME_ROLE
      kind: enum
      bits: [1, 2]
      mask_name: NAME_ROLE_MASK
      mask: 0x06
      mask_doc: "mask for bits 1-2"
      summary: "Bits 1-2: NAME_ROLE — mutually exclusive name-binding role"
      doc: "2-bit enum for name-binding role"
      values:
        - name: NAME_NONE
          role_value: 0
          value: 0x00
          label: ""
          doc: "not involved in name binding"
          runtime_selectable: false
        - name: NAME_REFERENCE
          role_value: 1
          value: 0x02
          label: reference
          doc: "uses a name"
          runtime_selectable: true
        - name: NAME_DECLARATION
          role_value: 2
          value: 0x04
          label: declaration
          doc: "introduces name (no body/impl)"
          runtime_selectable: true
        - name: NAME_DEFINITION
          role_value: 3
          value: 0x06
          label: definition
          doc: "introduces name (with body/impl)"
          runtime_selectable: true

    - name: IS_SCOPE
      kind: bit
      bits: [3]
      value: 0x08
      summary: "Bit 3: scope boundary"
      doc: "creates scope boundary"
      runtime_selectable: true

    - name: IS_EXPORTED
      kind: bit
      bits: [4]
      value: 0x10
      summary: "Bit 4: exported / publicly visible outside file/module"
      doc: "visible outside file/module"
      runtime_selectable: true

    - name: IS_CONSTITUENT
      kind: bit
      bits: [5]
      value: 0x20
      summary: |
        Bit 5: constituent — a meaningful sub-part of a larger construct that already
        represents the whole (string content/fragment/escape, a function declarator,
        an import specifier/clause). Unlike IS_SYNTAX_ONLY (a valueless grammar token),
        a constituent has payload but is subordinate; class selectors skip it and
        return the enclosing construct instead.
      doc: "a meaningful sub-part of a larger construct"
      runtime_selectable: true

  # Derived convenience constants (not independent bits).
  derived:
    - name: BINDS_NAME
      value: 0x04
      summary: 'Convenience: single-bit check for "binds a name" (definition OR declaration)'

  # Kept so older .def files still compile. IS_CONSTRUCT / IS_EMBODIED are 0x00
  # no-ops; the IS_KEYWORD* spellings alias IS_SYNTAX_ONLY.
  deprecated_aliases_summary: "Backward compatibility aliases"
  deprecated_aliases:
    - name: IS_CONSTRUCT
      value: "0x00"
      doc: "DEPRECATED: no-op"
    - name: IS_EMBODIED
      value: "0x00"
      doc: "DEPRECATED: no-op"
    - name: IS_KEYWORD
      value: IS_SYNTAX_ONLY
    - name: IS_KEYWORD_IF_LEAF
      value: IS_SYNTAX_ONLY

# ---------------------------------------------------------------------------
# Extraction strategy enums
# ---------------------------------------------------------------------------
# The third and fourth arguments of DEF_TYPE(raw_type, semantic_type,
# name_extraction, native_extraction, flags). `label` (used by ast_type_map())
# defaults to the lowercased name. runtime_selectable: false means the strategy
# needs native C++ and cannot be named by a runtime language config.
strategies:
  - enum: ExtractionStrategy
    header_comment: "Extraction strategy for node names/values"
    underlying: uint8_t
    explicit_values: all        # every enumerator carries its own "= N"
    values:
      - {name: NONE, value: 0, doc: "No extraction needed", runtime_selectable: true}
      - {name: NODE_TEXT, value: 1, doc: "Extract the node's own text content", runtime_selectable: true}
      - {name: FIRST_CHILD, value: 2, doc: "Extract text from first child", runtime_selectable: true}
      - {name: FIND_IDENTIFIER, value: 3, doc: 'Find first child of type "identifier"', runtime_selectable: true}
      - {name: FIND_PROPERTY, value: 4, doc: 'Find first child of type "property_identifier"', runtime_selectable: true}
      - {name: FIND_ASSIGNMENT_TARGET, value: 5, doc: "Find identifier in parent assignment (universal pattern)", runtime_selectable: true}
      - {name: FIND_QUALIFIED_IDENTIFIER, value: 6, doc: "Find qualified/scoped identifiers and extract just the name part", runtime_selectable: true}
      - {name: FIND_IN_DECLARATOR, value: 7, doc: "Find identifiers inside declarator nodes (universal pattern)", runtime_selectable: true}
      - {name: FIND_CALL_TARGET, value: 8, doc: "Find method/function name from call (handles obj.method patterns)", runtime_selectable: true}
      - {name: CUSTOM, value: 9, doc: "Language-specific custom logic", runtime_selectable: false}

  - enum: NativeExtractionStrategy
    header_comment: "Native context extraction strategies - pattern-based approach"
    underlying: uint8_t
    explicit_values: endpoints  # only the first and last carry a "= N"
    values:
      - {name: NONE, value: 0, doc: "No native context extraction"}
      - {name: FUNCTION_WITH_PARAMS, doc: "Standard function with parameter list"}
      - {name: FUNCTION_WITH_DECORATORS, doc: "Function with annotations/decorators"}
      - {name: ARROW_FUNCTION, doc: "Lambda/arrow function pattern"}
      - {name: ASYNC_FUNCTION, doc: "Async function pattern"}
      - {name: CLASS_WITH_INHERITANCE, doc: "Class with base classes"}
      - {name: CLASS_WITH_METHODS, doc: "Class with method definitions"}
      - {name: VARIABLE_WITH_TYPE, doc: "Typed variable assignment"}
      - {name: GENERIC_FUNCTION, doc: "Function with generic parameters"}
      - {name: METHOD_DEFINITION, doc: "Class/object method"}
      - {name: CONSTRUCTOR_DEFINITION, doc: "Constructor/initializer"}
      - {name: INTERFACE_DEFINITION, doc: "Interface/trait/protocol"}
      - {name: ENUM_DEFINITION, doc: "Enum/union type"}
      - {name: IMPORT_STATEMENT, doc: "Import/include/using"}
      - {name: EXPORT_STATEMENT, doc: "Export/public declarations"}
      - {name: FUNCTION_CALL, doc: "Function call/invocation with arguments"}
      - {name: CUSTOM, value: 255, doc: "Language-specific custom logic"}
